<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | AI SaaS</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module">
    import { checkAuthStatus } from './js/auth.js';
    checkAuthStatus(false);
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="glass-card">
      <div class="text-center mb-6">
        <h1>Reset password</h1>
        <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>
      </div>

      <div id="error-container" class="hidden"></div>

      <form id="reset-form">
        <div class="form-group mb-6">
          <label for="email">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <button type="submit" id="reset-btn" class="btn">
          <span class="spinner"></span>
          <span class="btn-text">Send reset link</span>
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="subtitle" style="margin-bottom: 0;">
          Remember your password? <a href="index.html">Back to login</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
