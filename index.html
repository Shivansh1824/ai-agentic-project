<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AI SaaS</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module">
    import { checkAuthStatus } from './js/auth.js';
    // Run route protection logic: do not require auth, but redirect if already logged in
    checkAuthStatus(false);
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="glass-card">
      <div class="text-center mb-6">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your AI workspace</p>
      </div>

      <div id="error-container" class="hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="form-group" style="text-align: right; margin-top: -0.5rem; margin-bottom: 1.5rem;">
          <a href="forgot-password.html" style="font-size: 0.875rem;">Forgot password?</a>
        </div>

        <button type="submit" id="login-btn" class="btn">
          <span class="spinner"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="subtitle" style="margin-bottom: 0;">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
