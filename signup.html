<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | AI SaaS</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module">
    import { checkAuthStatus } from './js/auth.js';
    checkAuthStatus(false);
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="glass-card">
      <div class="text-center mb-6">
        <h1>Create an account</h1>
        <p class="subtitle">Start your 14-day free trial</p>
      </div>

      <div id="error-container" class="hidden"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group mb-6">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" id="signup-btn" class="btn">
          <span class="spinner"></span>
          <span class="btn-text">Create Account</span>
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="subtitle" style="margin-bottom: 0;">
          Already have an account? <a href="index.html">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
